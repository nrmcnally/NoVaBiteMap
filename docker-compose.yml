services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BITEMAP_ACCOUNT_BACKEND: api
      API_BASE_URL: http://api:8000
      NWS_USER_AGENT: "${NWS_USER_AGENT:-BiteMap-NOVA/0.2 (contact: local@example.invalid)}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://bitemap:${POSTGRES_PASSWORD:-bitemap}@db:5432/bitemap
      REDIS_URL: redis://redis:6379/0
      NWS_USER_AGENT: "${NWS_USER_AGENT:-BiteMap-NOVA/0.2 (contact: local@example.invalid)}"
      CORS_ORIGINS: http://localhost:3000
      SESSION_HOURS: ${SESSION_HOURS:-168}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bitemap
      POSTGRES_USER: bitemap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitemap}
    volumes:
      - bitemap_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitemap -d bitemap"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - bitemap_redis:/data
    restart: unless-stopped

volumes:
  bitemap_postgres:
  bitemap_redis:
